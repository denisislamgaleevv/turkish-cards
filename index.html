<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турецкие слова - Блоки</title>
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%234CAF50'/%3E%3Ctext x='50' y='67' font-size='50' text-anchor='middle' fill='white'%3E🇹🇷%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Турецкие слова - Блоки</h1>

            <div class="info-panel">
                <div class="info-status">
                    <span id="online-status">Онлайн</span>
                    <span class="info-sep">•</span>
                    <span id="block-info-text">Выберите блок для изучения</span>
                </div>
                <div class="info-actions">
                    <button id="mode-toggle" class="info-btn" onclick="flashCards.toggleMode()">
                        Режим: RU → TR
                    </button>
                    <button class="info-btn info-btn-danger" onclick="flashCards.clearAllCache()">
                        Очистить кэш
                    </button>
                </div>
            </div>
        </header>

        <main id="main-content">
            <div id="blocks-container" class="blocks-container">
                <div class="loading">Загрузка блоков...</div>
            </div>

            <div id="cards-view" class="cards-view" style="display: none;">
                <div class="block-back-container">
                    <button id="block-btn" class="btn btn-block">← К выбору блока</button>
                </div>

                <div class="card-container">
                    <div id="card" class="card">
                        <div id="card-inner" class="card-inner">
                            <div class="card-face card-front">
                                <div class="word">Загрузка...</div>
                            </div>
                            <div class="card-face card-back">
                                <div class="word"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button id="prev-btn" class="btn btn-prev">← Назад</button>
                    <button id="next-btn" class="btn btn-next">Вперед →</button>
                </div>
            </div>
        </main>

        <footer>
            <p>Нажмите на карточку чтобы перевернуть</p>
            <p>Используйте ← → для навигации, B для возврата к блокам</p>
            <p>Version 6.0 Никакие права не защищены, Den, Feel Good Inc, 2025</p>
        </footer>
    </div>

    <script src="words.js"></script>
    <script src="script.js"></script>
</body>
</html>
